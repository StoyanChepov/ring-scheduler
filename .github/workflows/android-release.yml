# Builds the signed Android app and publishes it as a GitHub release when a
# version tag is pushed:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The tag sets the app's version (1.2.0, versionCode 10200), and the APK is
# attached as ring-scheduler.apk, which the website's "Get the Android app"
# button downloads from the latest release.
#
# The signing key and Firebase config are git-ignored, so they come from
# repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      keystore/ring-scheduler-release.jks, base64
#   ANDROID_KEYSTORE_PASSWORD    storePassword from keystore.properties
#   ANDROID_KEY_ALIAS            keyAlias
#   ANDROID_KEY_PASSWORD         keyPassword
#   GOOGLE_SERVICES_JSON_BASE64  app/google-services.json, base64
name: Android release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Restore signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/ring-scheduler-release.jks
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          cat > keystore.properties <<EOF
          storeFile=keystore/ring-scheduler-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: ./gradlew assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      # Without a working key Gradle still succeeds, but names the APK
      # ring-scheduler-release-unsigned.apk; phones can't install that one.
      - name: Check the APK is signed
        run: |
          apk=app/build/outputs/apk/release/ring-scheduler-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK; check the ANDROID_KEY* secrets."
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/ring-scheduler.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/ring-scheduler.apk" --title "$GITHUB_REF_NAME" --generate-notes
