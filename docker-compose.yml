services:
  postgres:
    image: postgres:18
    container_name: ring_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ring_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: ring_scheduler_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: